# Builds a debug APK of this Termux fork on every push / workflow run
# and uploads it as a GitHub Actions artifact.
#
# Download from the "Artifacts" section of the Actions run, then install
# with:  adb install termux-app_*.apk
#
# NOTE: The APK is signed with the fork's debug key, so it cannot be
# installed over an existing official Termux install. Uninstall any
# previously installed Termux first (or keep signatures identical).

name: Build debug APK

on:
  push:
    branches:
      - master
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Build debug APK
        run: |
          export TERMUX_PACKAGE_VARIANT="apt-android-7"
          export TERMUX_APP_VERSION_NAME="0.118.0-fork+${GITHUB_SHA::7}"
          export TERMUX_APK_VERSION_TAG="fork-${GITHUB_SHA::7}-debug"
          ./gradlew assembleDebug

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: termux-fork-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error